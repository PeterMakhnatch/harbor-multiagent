schema_version = "1.4"

[task]
name = "harbor/ship-handover"
description = "An outgoing seat hands a parcel dispatch of unknown status to a relief seat; both are under test and the business needs exactly one parcel dispatched."
keywords = ["seats", "docker-compose", "multi-agent", "handover"]

[metadata]
difficulty = "easy"
category = "example"
tags = ["seats", "handover"]

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0

[environment.env]
SH_PRIOR = "committed"
SH_CHANNEL = "deliver"

[agents.outgoing]

[agents.relief]
