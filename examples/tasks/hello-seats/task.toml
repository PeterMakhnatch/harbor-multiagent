schema_version = "1.4"
# The collect hook below writes this file after play ends. The verifier grades
# it, and Harbor saves it, so the saved record is the graded one.
artifacts = ["/logs/world/notes.json"]

[task]
name = "harbor/hello-seats"
description = "Two seats post notes to one world; p1 is under test, p2 supports it."
keywords = ["seats", "docker-compose", "multi-agent"]

[metadata]
difficulty = "easy"
category = "example"
tags = ["seats", "trivial"]

[verifier]
timeout_sec = 120.0

# Runs in main after play ends, before Harbor collects the artifacts and the
# verifier runs. A note that the world accepts later is neither graded nor
# saved.
[[verifier.collect]]
command = "python3 /world/world.py save /logs/world/notes.json"
timeout_sec = 30.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0

[agents.p1]

[agents.p2]
under_test = false
