x-player: &player
  build: ./player
  user: player
  working_dir: /home/player
  command: ["sleep", "infinity"]
  init: true
  networks: [play]
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    # The world writes each seat's token into that seat's volume at start.
    volumes: ["p1-token:/tokens/p1", "p2-token:/tokens/p2"]
    networks:
      play:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *player
    environment: {SEAT: p1}
    volumes: ["p1-token:/run/seat:ro"] # p1's token only
  p2:
    <<: *player
    environment: {SEAT: p2}
    volumes: ["p2-token:/run/seat:ro"] # p2's token only

networks:
  play: {}

volumes:
  p1-token: {}
  p2-token: {}
