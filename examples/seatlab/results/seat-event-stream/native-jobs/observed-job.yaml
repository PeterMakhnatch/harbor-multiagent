jobs_dir: jobs
job_name: observed-hello-team
n_attempts: 2
n_concurrent_trials: 1
retry:
  max_retries: 0
environment:
  type: docker
  delete: true
  force_build: false
participants:
  - seat: p1
    import_path: examples.seatlab.workbench.lifecycle_oracle:LifecycleOracle
    kwargs: {behavior: delay}
  - seat: p2
    import_path: examples.seatlab.workbench.lifecycle_oracle:LifecycleOracle
    kwargs: {behavior: return}
tasks:
  - path: examples/tasks/hello-seats
