[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flotilla-analysis"
version = "0.1.0"
description = "Measure what coordination buys a team of agents in Flotilla runs (harbor-multiagent job folders)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
flotilla-analyze = "flotilla_analysis.cli:main"
flotilla-timeline = "flotilla_analysis.timeline:main"

[tool.setuptools]
packages = ["flotilla_analysis"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
