name: Independent multi-agent regression gate
on:
  pull_request:
    paths: ['.github/workflows/seatlab-panel-gate.yml']
permissions:
  contents: read
jobs:
  observed-behavior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get the pinned example data reader
        uses: actions/checkout@v4
        with:
          repository: PeterMakhnatch/harbor-seatlab
          ref: 409ec865cf9cf25fe6ee868c1927039ef1def292
          path: .seatlab-tool
          persist-credentials: false
      - name: Fetch the pinned public Harbor study bundles
        run: python3 -I -S .seatlab-tool/examples/panel-replication/fetch_controls.py .study
      - name: Reject missing, changed, invalid or reused runs
        id: baseline
        uses: PeterMakhnatch/harbor-seatlab/actions/panel-recheck@409ec865cf9cf25fe6ee868c1927039ef1def292
        with:
          source: .study/source/study.json
          candidate: .study/unchanged/study.json
          design: .study/source/panel-design.json
          candidate-design: .study/unchanged/panel-design.json
          expected-sha256: 34b0bfde9b2c4e7a71e2906c9c17ba8d65239defe24cd9bd01575ff888bb0d7d
          expected-candidate-sha256: f69b4276ad27a50a14ab80dd67e832907048425b92ddb9d0317a1233a7cc51ce
          expected-design-sha256: bf74b26265eba2206a4f9e4382ecb8cd8bd342fab666db67bb7d8ee2dfa26611
          expected-candidate-design-sha256: 6fade1255de1cfbda0bf2e741523d8af7f7629c0d530a418bd5241c78ab2bc55
      - name: Assert the independent consumer received the gate's output
        env:
          REPORT: ${{ steps.baseline.outputs.report }}
        run: jq -e '.status == "matched" and .selection == ["s101", "s102"] and .counts.stable == 18' "$REPORT"
